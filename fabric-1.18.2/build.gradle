plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = minecraft_version
group = 'playereventlog'
base {
    archivesName = 'pel-part'
}

def partPackage = 'v' + minecraft_version.replace('.', '_')
def partSrc = layout.buildDirectory.dir('generated/part-src')

tasks.register('partSources', Sync) {
    from('../shared/mojmap/src/main/java/playereventlog/mc')
    from("../shared/compat/${compat_dir}/playereventlog/mc")
    into(partSrc.map { it.dir("playereventlog/mc/${partPackage}") })
    filter { String line -> line.replace('package playereventlog.mc;', "package playereventlog.mc.${partPackage};") }
}

sourceSets {
    main {
        java {
            srcDir '../core/src/main/java'
            srcDir(files(partSrc).builtBy('partSources'))
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

java {
    sourceCompatibility = JavaVersion.toVersion(java_version)
    targetCompatibility = JavaVersion.toVersion(java_version)
}
